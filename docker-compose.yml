services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: bluesky-kafka
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      # Một container vừa làm broker, vừa làm controller
      KAFKA_PROCESS_ROLES: broker,controller

      # Controller của cụm KRaft
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Khai báo các listener
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      # 9092 dành cho chương trình chạy ngoài Docker
      # 19092 dành cho container khác trong Docker network
      # 29093 dành cho controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # ID cố định của Kafka cluster
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      # Vì local chỉ có một broker
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  minio:
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    container_name: bluesky-minio
    hostname: minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      # Credential local để học và chạy trong Docker Compose.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    command: server /data --console-address ":9001"

    volumes:
      # Lưu dữ liệu object storage local qua các lần restart container.
      - minio-data:/data

volumes:
  minio-data: